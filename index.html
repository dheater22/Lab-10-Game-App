<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .scoreboard {
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
    }

    canvas {
      background: #222;
      border: 4px solid #4caf50;
      border-radius: 10px;
      max-width: 100%;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #4caf50;
      color: white;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    button:hover {
      background: #43a047;
    }

    .game-over {
      font-size: 1.3rem;
      color: #ff5252;
      min-height: 30px;
    }

    .mobile-controls {
      display: grid;
      grid-template-columns: repeat(3, 70px);
      gap: 10px;
      margin-top: 10px;
    }

    .mobile-controls button {
      width: 70px;
      height: 70px;
      font-size: 1.5rem;
    }

    @media (min-width: 768px) {
      .mobile-controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Snake Game</h1>

    <div class="scoreboard">
      <div>Score: <span id="score">0</span></div>
      <div>High Score: <span id="highScore">0</span></div>
    </div>

    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <div class="game-over" id="gameOverText"></div>

    <div class="controls">
      <button id="startBtn">Start Game</button>
      <button id="restartBtn">Restart</button>
      <button id="resetStorageBtn">Reset High Score</button>
    </div>

    <div class="mobile-controls">
      <div></div>
      <button onclick="changeDirection('UP')">⬆</button>
      <div></div>

      <button onclick="changeDirection('LEFT')">⬅</button>
      <button onclick="changeDirection('DOWN')">⬇</button>
      <button onclick="changeDirection('RIGHT')">➡</button>
    </div>
  </div>
